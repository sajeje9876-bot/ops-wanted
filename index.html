<body>

<header>
  <div class="logo">PDRM</div>
  <div class="header-title">
    <h2>OPS WANTED</h2>
    <p>PETA OPERASI BERSAMA · KUALA TERENGGANU</p>
  </div>
  <div class="header-status">● AKTIF</div>
</header>

<div class="container">

<!-- MAP PAGE -->
<section id="mapPage">

  <div class="toolbar">
    <button class="primary" id="gpsButton" onclick="toggleLiveLocation()">
      ◎ Lokasi Saya
    </button>
    <button class="green" onclick="pinInstruction()">
      + Tambah Pin
    </button>
  </div>

  <div id="status">Memuatkan peta...</div>

  <div class="map-info">
    <span>MODE SATELIT</span>
    <strong>● KUALA TERENGGANU</strong>
  </div>

  <div id="map"></div>

  <div class="panel" id="formPanel">
    <h3>📍 Maklumat Lokasi Baharu</h3>

    <form id="locationForm">
      <label>Nama lokasi *</label>
      <input id="name" maxlength="100" required
        placeholder="Contoh: Lokasi operasi">

      <label>Catatan / Maklumat</label>
      <textarea id="note" maxlength="2000"
        placeholder="Masukkan maklumat berkaitan lokasi..."></textarea>

      <label>Gambar lokasi</label>
      <input type="file" id="photo" accept="image/*">

      <p id="coordinates"></p>

      <div class="form-actions">
        <button type="submit" class="green" id="saveButton">
          Simpan Lokasi
        </button>
        <button type="button" class="light" onclick="cancelPin()">
          Batal
        </button>
      </div>
    </form>
  </div>

  <div class="panel">
    <h3>📌 Lokasi Terkini</h3>
    <div id="recentLocations">
      <div class="empty">Memuatkan lokasi...</div>
    </div>
    <button class="light" style="width:100%"
      onclick="showList()">
      Lihat Semua Lokasi →
    </button>
  </div>

</section>

<!-- LIST PAGE -->
<section id="listPanel">

  <div class="panel">
    <h3>📋 Senarai Lokasi Dipin</h3>
    <p class="small-note">
      Cari dan semak semua lokasi yang telah direkodkan oleh pengguna.
    </p>

    <div class="search-box">
      <input id="searchInput" type="search"
        placeholder="🔍 Cari nama atau catatan lokasi..."
        oninput="renderList()">
    </div>

    <div id="locationList">
      <div class="empty">Memuatkan senarai...</div>
    </div>
  </div>

</section>

</div>

<nav class="bottom-nav">
  <button id="mapTab" class="active" onclick="showMap()">
    <span>🗺️</span>Peta
  </button>
  <button id="listTab" onclick="showList()">
    <span>📋</span>Senarai
  </button>
  <button onclick="toggleLiveLocation()">
    <span>◎</span>Lokasi Saya
  </button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// ==================================
// SUPABASE CONNECTION
// ==================================

const SUPABASE_URL =
'https://aloihcghsyojrgclnbha.supabase.co';

// MASUKKAN PUBLISHABLE KEY ASAL ANDA DI SINI
const SUPABASE_KEY = 'sb_publishable_yHZqvWxJknMtOotfAApE_A_M88Spxq6';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ==================================
// MAP CONFIGURATION
// ==================================

const bounds = L.latLngBounds(
  [5.20,102.90],
  [5.50,103.25]
);

const map = L.map('map',{
  maxBounds:bounds,
  maxBoundsViscosity:1
}).setView([5.3302,103.1408],13);

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    attribution:'Tiles © Esri'
  }
).addTo(map);

// ==================================
// VARIABLES
// ==================================

let selectedLat = null;
let selectedLng = null;
let markers = [];
let allLocations = [];

let pinMarker = null;
let pinMode = false;

let watchId = null;
let gpsMarker = null;
let gpsCircle = null;

let holdTimer = null;
let holdStart = null;
let longPressTriggered = false;

const mapPage = document.getElementById('mapPage');
const listPanel = document.getElementById('listPanel');

function status(message) {
  document.getElementById('status').textContent = message;
}

// ==================================
// MAP NAVIGATION
// ==================================

function showMap() {
  mapPage.style.display = 'block';
  listPanel.style.display = 'none';

  document.getElementById('mapTab').classList.add('active');
  document.getElementById('listTab').classList.remove('active');

  setTimeout(() => map.invalidateSize(),150);
}

function showList() {
  mapPage.style.display = 'none';
  listPanel.style.display = 'block';

  document.getElementById('mapTab').classList.remove('active');
  document.getElementById('listTab').classList.add('active');

  renderList();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ==================================
// PIN INSTRUCTION
// ==================================

function pinInstruction() {
  showMap();
  pinMode = true;
  status('Tekan dan tahan lokasi pada peta selama 2 saat untuk meletakkan pin.');
  document.getElementById('map').scrollIntoView({
    behavior:'smooth',
    block:'center'
  });
}

// ==================================
// LONG PRESS PIN - MOBILE
// ==================================

const mapContainer = map.getContainer();

mapContainer.addEventListener('touchstart',function(e) {
  if (!e.touches || e.touches.length !== 1) return;

  const touch = e.touches[0];

  holdStart = {
    x:touch.clientX,
    y:touch.clientY
  };

  longPressTriggered = false;

  clearTimeout(holdTimer);

  holdTimer = setTimeout(function() {
    if (!holdStart) return;

    const rect = mapContainer.getBoundingClientRect();

    const point = L.point(
      holdStart.x - rect.left,
      holdStart.y - rect.top
    );

    const latlng = map.containerPointToLatLng(point);

    longPressTriggered = true;
    placePin(latlng);
    holdStart = null;

  },2000);

},{passive:true});

mapContainer.addEventListener('touchmove',function(e) {
  if (!holdStart || !e.touches.length) return;

  const touch = e.touches[0];

  const dx = touch.clientX - holdStart.x;
  const dy = touch.clientY - holdStart.y;

  if (Math.sqrt(dx*dx+dy*dy)>12) {
    clearTimeout(holdTimer);
    holdStart = null;
  }
},{passive:true});

mapContainer.addEventListener('touchend',function() {
  clearTimeout(holdTimer);
  holdStart = null;
},{passive:true});

mapContainer.addEventListener('touchcancel',function() {
  clearTimeout(holdTimer);
  holdStart = null;
},{passive:true});

// DESKTOP RIGHT CLICK / LONG PRESS
map.on('contextmenu',function(e) {
  placePin(e.latlng);
});

mapContainer.addEventListener('contextmenu',function(e) {
  e.preventDefault();
});

// ==================================
// PLACE PIN
// ==================================

function placePin(latlng) {
  if (!bounds.contains(latlng)) {
    status('Lokasi berada di luar kawasan Kuala Terengganu.');
    return;
  }

  selectedLat = latlng.lat;
  selectedLng = latlng.lng;

  pinMode = false;

  if (pinMarker) map.removeLayer(pinMarker);

  pinMarker = L.marker(latlng).addTo(map);
  pinMarker.bindPopup('📍 Lokasi pilihan anda').openPopup();

  showForm();
}

function showForm() {
  document.getElementById('coordinates').textContent =
    'Lat: '+selectedLat.toFixed(6)+
    ' | Long: '+selectedLng.toFixed(6);

  const formPanel = document.getElementById('formPanel');
  formPanel.style.display = 'block';

  formPanel.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });

  document.getElementById('name').focus();
  status('Lokasi pin berjaya dipilih.');
}

function cancelPin() {
  document.getElementById('formPanel').style.display = 'none';
  document.getElementById('locationForm').reset();

  if (pinMarker) {
    map.removeLayer(pinMarker);
    pinMarker = null;
  }

  selectedLat = null;
  selectedLng = null;
  pinMode = false;
}

// ==================================
// LIVE LOCATION - PERSONAL ONLY
// ==================================

function toggleLiveLocation() {

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;

    if (gpsMarker) map.removeLayer(gpsMarker);
    if (gpsCircle) map.removeLayer(gpsCircle);

    gpsMarker = null;
    gpsCircle = null;

    document.getElementById('gpsButton').textContent =
      '◎ Lokasi Saya';

    status('Live Location dihentikan.');
    return;
  }

  if (!navigator.geolocation) {
    alert('Peranti tidak menyokong GPS.');
    return;
  }

  if (!navigator.permissions) {
    status('Meminta kebenaran lokasi peranti...');
  }

  status('Mengesan Live Location anda...');

  watchId = navigator.geolocation.watchPosition(
    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      if (!bounds.contains([lat,lng])) {
        status('Lokasi anda berada di luar kawasan peta.');
        return;
      }

      const location = [lat,lng];

      if (!gpsMarker) {
        gpsMarker = L.marker(location,{
          icon:L.divIcon({
            className:'',
            html:'<div class="gps-dot"></div>',
            iconSize:[17,17],
            iconAnchor:[8,8]
          }),
          zIndexOffset:1000
        }).addTo(map);

        gpsMarker.bindPopup('◎ Lokasi semasa anda');
      } else {
        gpsMarker.setLatLng(location);
      }

      if (!gpsCircle) {
        gpsCircle = L.circle(location,{
          radius:accuracy,
          color:'#1688ee',
          fillColor:'#1688ee',
          fillOpacity:.12,
          weight:1
        }).addTo(map);
      } else {
        gpsCircle.setLatLng(location);
        gpsCircle.setRadius(accuracy);
      }

      map.setView(location,16);

      document.getElementById('gpsButton').textContent =
        '■ Henti Live Location';

      status('Live Location aktif. Ketepatan GPS ±'+
        Math.round(accuracy)+' meter.');

    },

    function(error) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;

      let message = 'Tidak dapat mengesan lokasi.';

      if (error.code === 1) {
        message = 'Akses lokasi ditolak. Benarkan lokasi dalam tetapan iPhone.';
      }

      status(message);
      alert(message);
    },

    {
      enableHighAccuracy:true,
      maximumAge:3000,
      timeout:20000
    }
  );
}

// ==================================
// SAVE LOCATION
// ==================================

document.getElementById('locationForm')
.addEventListener('submit',async function(e) {

  e.preventDefault();

  if (selectedLat === null || selectedLng === null) {
    alert('Sila pilih lokasi pada peta terlebih dahulu.');
    return;
  }

  const button = document.getElementById('saveButton');

  button.disabled = true;
  button.textContent = 'Menyimpan...';

  try {

    const name = document.getElementById('name').value.trim();
    const note = document.getElementById('note').value.trim();
    const file = document.getElementById('photo').files[0];

    if (!name) throw new Error('Nama lokasi diperlukan.');

    let photoUrl = null;

    if (file) {

      if (!file.type.startsWith('image/')) {
        throw new Error('Sila pilih fail gambar sahaja.');
      }

      if (file.size > 5*1024*1024) {
        throw new Error('Saiz gambar maksimum 5MB.');
      }

      const ext = file.name.split('.').pop().toLowerCase();
      const path = crypto.randomUUID()+'.'+ext;

      const {error:uploadError} = await db.storage
        .from('location-photos')
        .upload(path,file);

      if (uploadError) throw uploadError;

      const {data} = db.storage
        .from('location-photos')
        .getPublicUrl(path);

      photoUrl = data.publicUrl;
    }

    const {error} = await db.from('locations').insert({
      name:name,
      note:note || null,
      latitude:selectedLat,
      longitude:selectedLng,
      photo_url:photoUrl
    });

    if (error) throw error;

    alert('Lokasi berjaya disimpan!');

    cancelPin();
    await loadLocations();

  } catch(error) {
    alert('Gagal menyimpan: '+error.message);
  } finally {
    button.disabled = false;
    button.textContent = 'Simpan Lokasi';
  }
});

// ==================================
// LOAD LOCATIONS
// ==================================

async function loadLocations() {

  status('Memuatkan semua lokasi...');

  const {data,error} = await db
    .from('locations')
    .select('*')
    .order('created_at',{ascending:false});

  if (error) {
    status('Gagal memuatkan lokasi: '+error.message);
    return;
  }

  allLocations = data || [];

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  allLocations.forEach(item => {

    if (!bounds.contains([
      item.latitude,
      item.longitude
    ])) return;

    const marker = L.marker([
      item.latitude,
      item.longitude
    ]).addTo(map);

    const popup = document.createElement('div');

    const heading = document.createElement('strong');
    heading.textContent = item.name;
    popup.appendChild(heading);

    const description = document.createElement('p');
    description.textContent = item.note || 'Tiada catatan';
    popup.appendChild(description);

    const link = document.createElement('a');
    link.href = googleMapsUrl(item);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'Navigasi Google Maps';
    popup.appendChild(link);

    marker.bindPopup(popup);
    markers.push(marker);
  });

  renderRecent();
  renderList();

  status(allLocations.length+' lokasi direkodkan.');
}

// ==================================
// RECENT LOCATIONS
// ==================================

function renderRecent() {

  const box = document.getElementById('recentLocations');
  box.innerHTML = '';

  if (!allLocations.length) {
    box.innerHTML =
      '<div class="empty">Belum ada lokasi yang dipin.</div>';
    return;
  }

  allLocations.slice(0,3).forEach(item => {
    box.appendChild(createLocationCard(item));
  });
}

// ==================================
// SEARCH AND LIST
// ==================================

function renderList() {

  const box = document.getElementById('locationList');
  const search = (
    document.getElementById('searchInput')?.value || ''
  ).toLowerCase();

  box.innerHTML = '';

  const filtered = allLocations.filter(item =>
    (item.name || '').toLowerCase().includes(search) ||
    (item.note || '').toLowerCase().includes(search)
  );

  if (!filtered.length) {
    box.innerHTML =
      '<div class="empty">Tiada lokasi dijumpai.</div>';
    return;
  }

  filtered.forEach(item => {
    box.appendChild(createLocationCard(item));
  });
}

// ==================================
// LOCATION CARD
// ==================================

function createLocationCard(item) {

  const card = document.createElement('div');
  card.className = 'location-card';

  const heading = document.createElement('h4');
  heading.textContent = '📍 '+item.name;
  card.appendChild(heading);

  const note = document.createElement('p');
  note.textContent = item.note || 'Tiada catatan';
  card.appendChild(note);

  if (item.photo_url) {
    const img = document.createElement('img');
    img.src = item.photo_url;
    img.alt = 'Gambar lokasi';
    img.loading = 'lazy';
    card.appendChild(img);
  }

  const date = document.createElement('div');
  date.className = 'card-date';
  date.textContent = item.created_at
    ? new Date(item.created_at).toLocaleString('ms-MY')
    : '';
  card.appendChild(date);

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const view = document.createElement('button');
  view.className = 'view-btn';
  view.textContent = 'Lihat Peta';

  view.onclick = function() {
    showMap();

    map.setView([
      item.latitude,
      item.longitude
    ],17);

    const marker = markers.find(m => {
      const pos = m.getLatLng();

      return Math.abs(pos.lat-item.latitude)<0.000001 &&
             Math.abs(pos.lng-item.longitude)<0.000001;
    });

    if (marker) marker.openPopup();
  };

  const nav = document.createElement('a');
  nav.className = 'nav-link';
  nav.href = googleMapsUrl(item);
  nav.target = '_blank';
  nav.rel = 'noopener noreferrer';
  nav.textContent = '🧭 Navigasi';

  actions.appendChild(view);
  
actions.appendChild(nav);

// BUTANG PADAM PIN
const deleteBtn = document.createElement('button');
deleteBtn.textContent = '🗑️ Padam Pin';
deleteBtn.style.background = '#dc3545';
deleteBtn.style.color = 'white';
deleteBtn.style.marginTop = '8px';
deleteBtn.style.width = '100%';

deleteBtn.onclick = async function() {
  const confirmDelete = confirm(
    'Adakah anda pasti mahu memadam lokasi ini? Tindakan ini tidak boleh dibatalkan.'
  );

  if (!confirmDelete) return;

  deleteBtn.disabled = true;
  deleteBtn.textContent = 'Memadam...';

  try {
    const { error } = await db
      .from('locations')
      .delete()
      .eq('id', item.id);

    if (error) throw error;

    alert('Lokasi berjaya dipadam!');
    await loadLocations();

  } catch (error) {
    alert('Gagal memadam lokasi: ' + error.message);
    deleteBtn.disabled = false;
    deleteBtn.textContent = '🗑️ Padam Pin';
  }
};

actions.appendChild(deleteBtn);

card.appendChild(actions);

  return card;
}

// ==================================
// GOOGLE MAPS NAVIGATION
// ==================================

function googleMapsUrl(item) {
  return 'https://www.google.com/maps/dir/?api=1&destination='+
    encodeURIComponent(item.latitude+','+item.longitude);
}

// ==================================
// START
// ==================================

loadLocations();

// Auto refresh list to show pins added by other users.
setInterval(loadLocations,30000);

</script>
